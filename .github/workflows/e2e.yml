name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repo npm version
        run: npm install -g npm@11.5.1

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund

      - name: Restore oc-vite dist from published package
        # oc-vite has no hand-written source: it is generated by
        # packages/oc-vite/prepare.mjs (clone + build upstream vite), so the
        # published dist for the same version is identical. Fetch it instead
        # of rebuilding (~30s vs ~10min). The dist is gitignored build output.
        run: |
          VER=$(node -p "require('./packages/oc-vite/package.json').version")
          mkdir -p /tmp/oc-vite-pkg && cd /tmp/oc-vite-pkg
          npm pack oc-vite@$VER
          tar -xzf oc-vite-$VER.tgz
          for f in dist bin types misc client.d.ts index.cjs index.d.cts; do
            [ -e "package/$f" ] && cp -r "package/$f" "$GITHUB_WORKSPACE/packages/oc-vite/$f"
          done
          test -d "$GITHUB_WORKSPACE/packages/oc-vite/dist"

      - name: Build all packages
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install --no-audit --no-fund

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - name: Verify production packaging
        # oc package (production build) per staged component, asserting the
        # tarball inputs exist and the component CSS is bundled.
        working-directory: e2e
        run: npm run test:package

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
